<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>X_ITE View</title>
  <script src="https://cdn.jsdelivr.net/npm/x_ite@latest/dist/x_ite.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    x3d-canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <x3d-canvas splash-screen="false" context-menu="false">
    <X3D profile="Immersive" version="4.0">
      <Scene>
        <LayerSet activeLayer="1" order="1 2">
          <!-- Layer 0: Base 3D Model -->
          <Layer DEF="Layer0">
            <Background skyColor="0.1 0.1 0.15"></Background>
            <NavigationInfo type='"EXAMINE" "ANY"' headlight="true"></NavigationInfo>
            <Viewpoint DEF="VP_XITE" position="0 0 8" description="MainVP"></Viewpoint>
            
            <Transform DEF="BoxGeom" translation="0 0 0">
              <Shape>
                <Appearance>
                  <Material diffuseColor="0.2 0.7 0.9"></Material>
                </Appearance>
                <Box size="1.5 1.5 1.5"></Box>
              </Shape>
            </Transform>
          </Layer>

          <!-- Layer 1: Foreground HUD Layer -->
          <Layer DEF="Layer1">
            <NavigationInfo headlight="true" type='"NONE"'></NavigationInfo>
            <Viewpoint DEF="VP_Layer1" position="0 0 8" description="Layer1VP"></Viewpoint>
        
            <Transform translation="0 0 0.8">
              <Shape>
                <Appearance>
                  <Material diffuseColor="1 1 1" emissiveColor="1 1 1"></Material>
                </Appearance>
                <Text string='"Layer 1" "Overlay Text"' solid="false">
                  <FontStyle 
                    family='"Arial" "Helvetica" "SANS"' 
                    style="PLAIN" 
                    spacing="0.95" 
                    justify='"MIDDLE" "MIDDLE"' 
                    size="0.45">
                  </FontStyle>
                </Text>
              </Shape>
            </Transform>
          </Layer>
        </LayerSet>
      </Scene>
    </X3D>
  </x3d-canvas>

  <script>
    let isInternalUpdate = false;

    X3D((browser) => {
      const vp = browser.currentScene.getNamedNode("VP_XITE");
      if (vp) {
        const sendUpdate = () => {
          if (isInternalUpdate) return;
          window.parent.postMessage({
            type: "VIEWPOINT_UPDATE",
            position: vp.position.toString(),
            orientation: vp.orientation.toString()
          }, "*");
        };
        vp.addFieldCallback("position", sendUpdate);
        vp.addFieldCallback("orientation", sendUpdate);
      }
    });

    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "VIEWPOINT_UPDATE") {
        const browser = X3D.getBrowser();
        const vp0 = browser?.currentScene?.getNamedNode("VP_XITE");
        if (vp0) {
          isInternalUpdate = true;
          const pos = new X3D.SFVec3f(...e.data.position.split(" ").map(Number));
          const ori = new X3D.SFRotation(...e.data.orientation.split(" ").map(Number));
          vp0.position = pos;
          vp0.orientation = ori;
          requestAnimationFrame(() => {
            isInternalUpdate = false;
          });
        }
      }
    });
  </script>
</body>
</html>
