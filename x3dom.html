<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>X3DOM Layered View</title>
  
  <!-- Reliable, preloaded PT Sans webfont -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://andreasplesch.github.io/x3dom/dist/x3dom.css">
  <script src="https://andreasplesch.github.io/x3dom/dist/x3dom-full.debug.js"></script>
  
  <script>
    (function() {
      const origFill = CanvasRenderingContext2D.prototype.fillText;
      CanvasRenderingContext2D.prototype.fillText = function(text, x, y, maxW) {
        const match = /(\d+(?:\.\d+)?)px/.exec(this.font);
        const fs = match ? parseFloat(match[1]) : 32;

        this.save();
        // 1. Force the canvas context to strictly use PT Sans (removes Segoe UI's base on '1')
        this.font = `normal ${fs}px "PT Sans", sans-serif`;

        // 2. Subtle stem dilation to match X_ITE's geometric mesh weight
        this.lineWidth = fs * 0.030;
        this.strokeStyle = this.fillStyle;
        this.lineJoin = 'miter';
        this.miterLimit = 2;

        if (maxW !== undefined) {
          this.strokeText(text, x, y, maxW);
          origFill.call(this, text, x, y, maxW);
        } else {
          this.strokeText(text, x, y);
          origFill.call(this, text, x, y);
        }
        this.restore();
      };
    })();
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'PT Sans', sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Base 3D Scene */
    #x3dLayer0 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      border: none;
    }

    /* HUD Overlay Scene */
    #x3dLayer1 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      border: none;
      background: transparent !important;
      pointer-events: none;
    }

    #x3dLayer1 canvas {
      background: transparent !important;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Layer 0: Navigable 3D Scene -->
    <x3d id="x3dLayer0" showStat="false" showLog="false">
      <scene>
        <environment gammaCorrectionDefault="none"></environment>
        <background skyColor="0.1 0.1 0.15"></background>
        <navigationInfo type='"EXAMINE" "ANY"' headlight="true"></navigationInfo>
        <viewpoint id="VP_X3DOM" position="0 0 8" description="MainVP"></viewpoint>

        <transform DEF="BoxGeom" translation="0 0 0">
          <shape>
            <appearance>
              <material diffuseColor="0.2 0.7 0.9"></material>
            </appearance>
            <box size="1.5 1.5 1.5"></box>
          </shape>
        </transform>
      </scene>
    </x3d>

    <!-- Layer 1: Fixed HUD Overlay -->
    <x3d id="x3dLayer1" showStat="false" showLog="false">
      <scene>
        <environment gammaCorrectionDefault="none"></environment>
        <navigationInfo type='"NONE"' headlight="true"></navigationInfo>
        <viewpoint position="0 0 8" description="HUD_VP"></viewpoint>

        <transform translation="0 0 0.8">
          <shape>
            <appearance>
              <material diffuseColor="1 1 1" emissiveColor="1 1 1"></material>
            </appearance>
            <text id="hudText" string='"Layer 1" "Overlay Text"' solid="false">
              <!-- spacing="0.94" gives clean vertical clearance between 'y' and 'l' -->
              <fontStyle 
                family='"PT Sans"' 
                style="PLAIN" 
                quality="2" 
                spacing="0.94" 
                justify='"MIDDLE" "MIDDLE"' 
                size="0.45">
              </fontStyle>
            </text>
          </shape>
        </transform>
      </scene>
    </x3d>
  </div>

  <script>
    // Refresh the text node as soon as the Google Font is confirmed ready in memory
    document.fonts.ready.then(() => {
      const textNode = document.getElementById("hudText");
      if (textNode) {
        const str = textNode.getAttribute("string");
        textNode.setAttribute("string", '""');
        requestAnimationFrame(() => {
          textNode.setAttribute("string", str);
        });
      }
    });

    function parseOrientation(ori) {
      if (typeof ori === "string") return ori;
      if (Array.isArray(ori)) {
        if (ori[0] && typeof ori[0] === "object" && "x" in ori[0]) {
          return `${ori[0].x} ${ori[0].y} ${ori[0].z} ${ori[1]}`;
        }
        if (ori.length === 4) return ori.join(" ");
      }
      return "0 0 1 0";
    }

    function parsePosition(pos) {
      if (typeof pos === "string") return pos;
      if (pos && typeof pos === "object" && "x" in pos) {
        return `${pos.x} ${pos.y} ${pos.z}`;
      }
      if (Array.isArray(pos)) return pos.join(" ");
      return "0 0 8";
    }

    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "VIEWPOINT_UPDATE") {
        const vp = document.getElementById("VP_X3DOM");
        if (vp) {
          vp.setAttribute("position", e.data.position);
          vp.setAttribute("orientation", e.data.orientation);
        }
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const canvas0 = document.getElementById("x3dLayer0");
      const vp = document.getElementById("VP_X3DOM");
      let lastPos = "", lastOri = "";

      function onCamMotion(evt) {
        if (!evt || !evt.position || !evt.orientation) return;
        const posStr = parsePosition(evt.position);
        const oriStr = parseOrientation(evt.orientation);

        if (posStr === lastPos && oriStr === lastOri) return;
        lastPos = posStr;
        lastOri = oriStr;

        window.parent.postMessage({
          type: "VIEWPOINT_UPDATE",
          position: posStr,
          orientation: oriStr
        }, "*");
      }

      if (canvas0) canvas0.addEventListener("viewpointChanged", onCamMotion);
      if (vp) vp.addEventListener("viewpointChanged", onCamMotion);
    });
  </script>
</body>
</html>
